name: Tests de la mission cinéma

on:
  push:
    paths:
      - "version-finale/mission-sql-cinema/**"
      - ".github/workflows/mission-sql-cinema-tests.yml"
      - "setup.ps1"
      - "setup.bat"
  pull_request:
    paths:
      - "version-finale/mission-sql-cinema/**"
      - ".github/workflows/mission-sql-cinema-tests.yml"
      - "setup.ps1"
      - "setup.bat"

jobs:
  tests-unitaires:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version-finale/mission-sql-cinema
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Exécuter les tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Verifier la syntaxe du setup PowerShell
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "..\..\setup.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $setup,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
